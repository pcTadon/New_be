<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Votre Billet - NEW.BE</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .ticket { background: #fff; border: 2px dashed #000; border-radius: 10px; padding: 25px; width: 320px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    canvas { margin: 15px 0; }
    .status { font-weight: bold; padding: 8px; border-radius: 4px; margin-top: 10px; }
    .valid { background: #d4edda; color: #155724; }
  </style>
</head>
<body>

<div class="ticket">
  <h2>🎟️ Billet Officiel</h2>
  <h3 style="margin: 0; color: #d4af37;">NEW.BE 2026</h3>
  <p><strong id="name">Chargement...</strong></p>
  <p id="email" style="font-size: 0.85rem; color: #666;"></p>
  
  <canvas id="qrcode"></canvas>

  <div class="status valid">✅ BILLET CONFIRMÉ</div>
  <p style="font-size: 0.75rem; color: #888; margin-top: 15px;">Présentez ce QR code à l'entrée de l’événement à Charleroi.</p>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');

  if (sessionId) {
    fetch(`/api/ticket-info/${sessionId}`)
      .then(res => res.json())
      .then(data => {
        if (data.valid) {
          document.getElementById('name').innerText = data.customerName;
          document.getElementById('email').innerText = data.email;
          QRCode.toCanvas(document.getElementById('qrcode'), data.sessionId);
        } else {
          alert('Erreur lors du chargement du billet.');
        }
      })
      .catch(err => {
        alert('Erreur de connexion avec le serveur.');
      });
  } else {
    document.body.innerHTML = '<h2>Aucun billet trouvé.</h2>';
  }
</script>

</body>
</html>
